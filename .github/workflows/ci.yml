name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            adapter/requirements*.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q adapter chat-api web-research

      - name: Check shell syntax
        run: find adapter web-research -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Test Adapter
        working-directory: adapter
        run: python -m pytest -q

      - name: Test Chat API and Bridge
        working-directory: chat-api
        run: python -m pytest -q

      - name: Test Web Research
        working-directory: web-research
        run: python -m pytest -q

      - name: Run fake end-to-end stack
        if: matrix.python-version == '3.11'
        run: python adapter/scripts/live_fake_stack.py

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
